name: Release

# Push a tag (v1.2.0) and GitHub builds the exe and publishes the release.
# Nothing is uploaded from the local machine except the source code.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test WatermarkRemover.sln -v minimal --nologo

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/WatermarkRemover.App/WatermarkRemover.App.csproj -c Release -o publish /p:Version=$version --nologo
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          "Building version $version from tag $env:GITHUB_REF_NAME"

      - name: Create release with exe
        uses: softprops/action-gh-release@v2
        with:
          name: WatermarkRemover ${{ github.ref_name }}
          body: |
            自动构建版本 ${{ github.ref_name }}。

            下载 `WatermarkRemover.exe` 双击即用，无需安装；老版本可在应用内一键升级。
          files: publish/WatermarkRemover.exe
