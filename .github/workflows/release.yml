name: Release

# Push a tag (v1.2.0) and GitHub builds the exe and publishes the release.
# Nothing is uploaded from the local machine except the source code.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test WatermarkRemover.sln -v minimal --nologo

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/WatermarkRemover.App/WatermarkRemover.App.csproj -c Release -o publish /p:Version=$version --nologo
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          "Building version $version from tag $env:GITHUB_REF_NAME"

      - name: Package exe + models as zip
        shell: pwsh
        run: |
          # The app ships as exe + Models\ (PP-OCR models); the zip lets updates refresh both.
          # The bare exe is still uploaded so pre-1.7 clients can keep upgrading.
          Compress-Archive -Path publish/* -DestinationPath WatermarkRemover.zip -Force
          Get-ChildItem publish | Select-Object Name, Length

      - name: Create release with exe
        uses: softprops/action-gh-release@v2
        with:
          name: WatermarkRemover ${{ github.ref_name }}
          body: |
            自动构建版本 ${{ github.ref_name }}。

            推荐下载 `WatermarkRemover.zip`，解压后双击 `WatermarkRemover.exe` 即用，无需安装；
            `WatermarkRemover.exe`（单文件版）兼容老版本的自动升级通道。
          files: |
            WatermarkRemover.zip
            publish/WatermarkRemover.exe
